name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: astra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d astra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      GOCACHE: /tmp/go-cache
      MDS_TEST_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/astra_test?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Go Tests
        run: go test ./...

      - name: Run Go Build
        run: go build ./...
