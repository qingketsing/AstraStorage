name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-test:
    runs-on: ubuntu-latest

    env:
      GOCACHE: /tmp/go-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run unit tests
        run: go test ./...

  build:
    runs-on: ubuntu-latest

    env:
      GOCACHE: /tmp/go-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run build
        run: go build ./...

  postgres-integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: astra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d astra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      GOCACHE: /tmp/go-cache
      MDS_TEST_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/astra_test?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run PostgreSQL integration tests
        run: go test -count=1 ./test/integration -run TestPostgresIntegration

  etcd-integration:
    runs-on: ubuntu-latest

    env:
      GOCACHE: /tmp/go-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run etcd integration tests
        run: go test -tags=integration ./internal/platform/etcd/leader
