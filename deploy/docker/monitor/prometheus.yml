global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 127.0.0.1:9093

scrape_configs:
  - job_name: astra-mds
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:8080
        labels:
          service: mds
          env: local

  - job_name: astra-gateway
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:11080
        labels:
          service: gateway
          env: local

  - job_name: astra-datanode
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:10080
        labels:
          service: datanode
          env: local
