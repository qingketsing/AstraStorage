bind 0.0.0.0
port 26379
protected-mode no
sentinel resolve-hostnames yes
sentinel announce-hostnames yes
sentinel monitor astra-cache redis-cache-master 6379 3
sentinel down-after-milliseconds astra-cache 5000
sentinel failover-timeout astra-cache 10000
sentinel parallel-syncs astra-cache 1
sentinel monitor astra-coord redis-coord-master 6379 3
sentinel down-after-milliseconds astra-coord 5000
sentinel failover-timeout astra-coord 10000
sentinel parallel-syncs astra-coord 1
